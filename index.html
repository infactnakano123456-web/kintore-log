<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d92b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレログ">
<title>筋トレログ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <h1 id="title">記録</h1>
  <div id="topbar-actions"></div>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="record" class="active"><span class="ico">＋</span><span>記録</span></button>
  <button data-tab="history"><span class="ico">▦</span><span>履歴</span></button>
  <button data-tab="analysis"><span class="ico">↗</span><span>分析</span></button>
  <button data-tab="export"><span class="ico">{ }</span><span>AI出力</span></button>
  <button data-tab="settings"><span class="ico">⚙</span><span>設定</span></button>
</nav>

<div id="sheet-backdrop" class="backdrop hidden"></div>
<section id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></section>
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
